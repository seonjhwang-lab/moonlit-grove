<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1410" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="달빛 숲의 수호자 — Moonlit Grove Prototype 0.1.0" />
<title>달빛 숲의 수호자</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ==========================================================================
   달빛 숲의 수호자 — Moonlit Grove
   style.css : 레이아웃 / 반응형 스케일 / 오버레이 UI
   v0.1.1 PORTRAIT CONVERSION: 세로(9:16)가 기본 플레이 화면이다.
   데스크톱에서는 이 세로 무대를 화면 중앙에 최대 크기로 축소해 보여준다
   (가로로 늘리거나 억지로 풀스크린 16:9 로 왜곡하지 않는다).
   ========================================================================== */

:root {
  --mg-bg:        #05080a;   /* 레터박스 바깥 배경 */
  --mg-ink:       #f2f7ea;
  --mg-ink-dim:   #9fb39a;
  --mg-leaf:      #4f9d5d;
  --mg-leaf-deep: #2c6b3f;
  --mg-moon:      #cfe4ff;
  --mg-panel:     rgba(8, 18, 14, 0.88);
  --mg-ui-font:   "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR",
                  "Malgun Gothic", system-ui, sans-serif;
  --mg-font-display: "Gowun Batang", "Noto Serif KR", "Apple SD Gothic Neo", serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;   /* 모바일 주소창 높이 변화에 맞춰 실제 보이는 영역만 채운다 */
  overflow: hidden;
  background: var(--mg-bg);
  color: var(--mg-ink);
  font-family: var(--mg-ui-font);
  /* 모바일: 스크롤 바운스 / 더블탭 확대 / 텍스트 선택 방지 */
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}

/* --------------------------------------------------------------------------
   무대(stage) : 9:16 세로 비율을 유지하며 화면 중앙에 최대 크기로 배치.
   모바일 세로 화면에서는 거의 꽉 차고, 데스크톱/가로 화면에서는 세로 무대가
   가운데 놓이고 좌우에 여백이 남는다 (풀스크린으로 왜곡해 늘리지 않는다).
   실제 픽셀 크기는 game.js 의 resize() 가 계산해 인라인 스타일로 지정한다.
   -------------------------------------------------------------------------- */

#game-root {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--mg-bg);
}

#stage {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 16;   /* JS 계산 전 초기 표시용 폴백 */
  max-width: 100%;
  max-height: 100%;
  overflow: hidden;
  background: #0b1410;
  box-shadow: 0 0 0 1px rgba(120, 180, 130, 0.18),
              0 12px 40px rgba(0, 0, 0, 0.6);
}

#game-canvas {
  display: block;
  width: 100%;
  height: 100%;
  /* 픽셀아트 확대 시 보간 없이 또렷하게 */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* UI 레이어: 캔버스 위에 겹치며, 기본적으로 클릭을 통과시킨다 */
#ui-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
#ui-layer button,
#ui-layer input,
#ui-layer textarea,
#ui-layer .interactive { pointer-events: auto; }

/* --------------------------------------------------------------------------
   HUD
   -------------------------------------------------------------------------- */

#hud {
  position: absolute;
  inset: 0;
  padding: calc(2.2% + env(safe-area-inset-top)) calc(2.6% + env(safe-area-inset-right))
           calc(2.2% + env(safe-area-inset-bottom)) calc(2.6% + env(safe-area-inset-left));
}

.hud-slot {
  position: absolute;
  top: calc(2.2% + env(safe-area-inset-top));
  font-size: clamp(11px, 2.4vh, 18px);
  letter-spacing: 0.02em;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55);
}
.hud-left  { left:  calc(2.6% + env(safe-area-inset-left)); }
.hud-right { right: calc(2.6% + env(safe-area-inset-right)); color: var(--mg-ink-dim); }

/* --------------------------------------------------------------------------
   오버레이 (타이틀 / 대화 / 결과 등 공통)
   -------------------------------------------------------------------------- */

.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  background: radial-gradient(120% 90% at 50% 40%,
              rgba(14, 32, 24, 0.72) 0%, rgba(3, 7, 6, 0.94) 100%);
  pointer-events: auto;
  z-index: 10;
}
.overlay[hidden] { display: none; }

.overlay-fullscreen {
  position: fixed;
  z-index: 100;
  background: #05080a;
}

.overlay-inner {
  padding: 4vmin 6vmin;
  max-width: 90%;
}

.game-title {
  margin: 0;
  font-family: var(--mg-font-display);
  font-size: clamp(32px, 10vh, 80px);
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--mg-moon);
  text-shadow: 0 0 18px rgba(150, 200, 255, 0.35),
               0 4px 0 rgba(0, 0, 0, 0.5);
}

.game-subtitle {
  margin: 0.6em 0 0;
  font-size: clamp(12px, 2.6vh, 20px);
  color: var(--mg-leaf);
  letter-spacing: 0.24em;
}

.game-version {
  margin: 1.4em 0 0;
  font-size: clamp(10px, 1.9vh, 14px);
  color: var(--mg-ink-dim);
  opacity: 0.75;
}

/* --------------------------------------------------------------------------
   버튼 (엄지로 누르기 충분한 크기)
   -------------------------------------------------------------------------- */

.ui-button {
  margin-top: 2.2em;
  min-width: 46vmin;
  max-width: 320px;
  min-height: 48px;
  padding: 0.8em 2em;
  font-family: inherit;
  font-size: clamp(14px, 2.9vh, 22px);
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--mg-ink);
  background: linear-gradient(180deg, var(--mg-leaf) 0%, var(--mg-leaf-deep) 100%);
  border: 2px solid rgba(220, 245, 220, 0.55);
  border-radius: 10px;
  cursor: pointer;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.45);
  transition: transform 90ms ease, box-shadow 90ms ease, filter 90ms ease;
}
.ui-button:active {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
  filter: brightness(1.12);
}

/* --------------------------------------------------------------------------
   터치 컨트롤 (모바일) — 터치 기기로 감지된 경우에만 표시된다 (input.js 가
   body 에 mg-touch 클래스를 붙인다). 데스크톱에서는 완전히 숨긴다.
   -------------------------------------------------------------------------- */

/* 터치 미지원 기기에서는 명시적으로 숨긴다. 개별 컨트롤이 자기 display 값을
   (flex 등) 갖고 있어도 이 규칙의 명시도(specificity)가 항상 더 높으므로
   선언 순서와 무관하게 이긴다 — display 값 충돌을 피하기 위한 구조. */
body:not(.mg-touch) #joystick-zone,
body:not(.mg-touch) .joystick-base,
body:not(.mg-touch) .attack-button {
  display: none;
}

/* 좌하단: 조이스틱을 인식하는 넓은 터치 영역 (그 자체는 보이지 않는다).
   v0.1.1: 세로 화면은 세로 길이가 훨씬 길어서, 원래 랜드스케이프용이던 62%
   높이를 그대로 쓰면 엄지가 자연스럽게 닿는 범위를 넘어 화면 중간까지
   조이스틱 발동 영역이 된다. 엄지 도달 범위에 맞춰 하단 45%로 낮춘다. */
#joystick-zone {
  position: fixed;
  left: 0;
  bottom: 0;
  width: 55%;
  height: 45%;
  pointer-events: auto;
  touch-action: none;
}

.joystick-base {
  position: fixed;
  width: clamp(64px, 20vmin, 100px);
  height: clamp(64px, 20vmin, 100px);
  margin-left: calc(clamp(64px, 20vmin, 100px) / -2);
  margin-top: calc(clamp(64px, 20vmin, 100px) / -2);
  border-radius: 50%;
  background: rgba(20, 40, 30, 0.4);
  border: 2px solid rgba(220, 245, 220, 0.4);
  pointer-events: none;
  z-index: 5;
}
.joystick-base[hidden] { display: none; }

.joystick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 42%;
  height: 42%;
  margin-left: -21%;
  margin-top: -21%;
  border-radius: 50%;
  background: rgba(224, 245, 224, 0.7);
  border: 2px solid rgba(255, 255, 255, 0.55);
  will-change: transform;
}

/* 우하단: 공격 버튼 (플레이스홀더 — 실제 판정은 PHASE 5) */
.attack-button {
  position: fixed;
  right: calc(4.5% + env(safe-area-inset-right));
  bottom: calc(6% + env(safe-area-inset-bottom));
  width: clamp(58px, 17vmin, 84px);
  height: clamp(58px, 17vmin, 84px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(24px, 8vmin, 36px);
  line-height: 1;
  color: var(--mg-ink);
  background: linear-gradient(180deg, var(--mg-cape, #9a3f3f) 0%, #6c2a2a 100%);
  border: 2px solid rgba(255, 255, 255, 0.4);
  border-radius: 50%;
  box-shadow: 0 5px 0 rgba(0, 0, 0, 0.45);
  pointer-events: auto;
  touch-action: none;
  cursor: pointer;
  transition: transform 80ms ease, box-shadow 80ms ease, filter 80ms ease;
}
.attack-button.is-pressed {
  transform: translateY(4px);
  box-shadow: 0 1px 0 rgba(0, 0, 0, 0.45);
  filter: brightness(1.15);
}

/* --------------------------------------------------------------------------
   디버그 패널 (v0.1.1) — game.js 의 DEBUG_MOBILE_LAYOUT 이 true 일 때만 채워지고
   보인다. 평소에는 [hidden] 으로 완전히 빠진다.
   -------------------------------------------------------------------------- */

.debug-panel {
  position: fixed;
  left: calc(6px + env(safe-area-inset-left));
  top: calc(6px + env(safe-area-inset-top));
  margin: 0;
  padding: 6px 8px;
  max-width: 60vw;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 10px;
  line-height: 1.4;
  white-space: pre;
  color: #baffc9;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(186, 255, 201, 0.35);
  border-radius: 4px;
  pointer-events: none;
  z-index: 999;
}
.debug-panel[hidden] { display: none; }
</style>
</head>
<body>

  <!-- 게임 전체 루트: 캔버스 + 오버레이 UI가 같은 좌표계 위에 겹쳐진다 -->
  <div id="game-root">

    <!-- 내부 해상도 360x640 (9:16, 세로 우선). CSS 크기는 JS가 화면비를 유지하며 계산 -->
    <div id="stage">
      <canvas id="game-canvas" width="360" height="640"></canvas>

      <!-- 캔버스 위에 겹치는 DOM UI 레이어 (한글 텍스트 가독성을 위해 DOM 사용) -->
      <div id="ui-layer">

        <!-- HUD: 좌상단 하트(PHASE 7), 우상단 버전 -->
        <div id="hud">
          <div id="hud-hearts" class="hud-slot hud-left"></div>
          <div id="hud-version" class="hud-slot hud-right">v0.1.5</div>
        </div>

        <!-- DEBUG_MOBILE_LAYOUT 이 true 일 때만 game.js 가 내용을 채우고 보여준다 -->
        <pre id="debug-panel" class="debug-panel" hidden></pre>

        <!-- 터치 컨트롤 레이어 (모바일 전용, input.js 가 제어) -->
        <div id="touch-layer">
          <div id="joystick-zone" class="touch-controls"></div>
          <div id="joystick-base" class="touch-controls joystick-base" hidden>
            <div id="joystick-knob" class="joystick-knob"></div>
          </div>
          <button id="btn-attack" class="touch-controls attack-button" type="button" aria-label="공격">⚔</button>
        </div>

        <!-- 타이틀 화면 -->
        <div id="overlay-title" class="overlay">
          <div class="overlay-inner">
            <h1 class="game-title">달빛 숲</h1>
            <p class="game-subtitle">달빛 숲의 수호자</p>
            <button id="btn-start" class="ui-button" type="button">모험 시작</button>
            <p class="game-version">Prototype 0.1.5</p>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- 시스템 순서대로 로드 (클래식 스크립트: file:// 로도 열린다).
       쿼리스트링 ?v= 는 캐시 버스터다 — 모바일 브라우저가 개발 서버의
       Cache-Control: no-store 를 무시하고 이전 방문 때 받은 js/*.js 를 재사용하는
       문제(버전/전투 로직이 옛날 것으로 실행됨)를 막기 위함이다. 버전을 올릴 때마다
       이 값도 js/game.js 의 VERSION 과 같은 값으로 같이 올려야 한다. -->
<script>

/* ---- js/audio.js ---- */
/* ==========================================================================
   audio.js — 사운드 관리 (합성 효과음)
   PHASE 5 범위: 검 휘두르는 소리.
   PHASE 6 범위: 모슬링 피격 / 처치 소리.
     - 브라우저 자동재생 정책 때문에 AudioContext 는 사용자 제스처 이후에만
       만들 수 있다 (unlock() 은 ui.js 의 "모험 시작" 클릭에서 이미 호출된다).
     - 오디오 실패가 게임 진행을 막아서는 안 된다 — 모든 단계를 try/catch 로
       감싸고, 실패 시 조용히 무음으로 넘어간다.
   나머지 효과음(영입/다리/상자 등)은 해당 기능이 생기는 Phase에서 같은 패턴으로 추가한다.
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = global.MG = global.MG || {};

  var Audio = {
    ctx: null,
    unlocked: false,
    _noiseBuffer: null,

    /* main.js 부팅 시 호출된다. 여기서는 AudioContext 를 만들지 않는다 —
       사용자 제스처 없이 생성하면 대부분의 브라우저가 suspended 상태로 묶어둔다. */
    init: function () {},

    /* 사용자의 첫 탭/클릭(예: "모험 시작" 버튼)에서 호출해야 한다. */
    unlock: function () {
      if (this.unlocked) return;
      try {
        var Ctx = global.AudioContext || global.webkitAudioContext;
        if (!Ctx) return;
        this.ctx = new Ctx();
        this._noiseBuffer = this._buildNoiseBuffer();
        if (this.ctx.state === 'suspended' && this.ctx.resume) this.ctx.resume();
        this.unlocked = true;
      } catch (e) {
        this.ctx = null; // 오디오 없이도 게임은 계속된다
      }
    },

    _buildNoiseBuffer: function () {
      var len = Math.floor(this.ctx.sampleRate * 0.2);
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return buf;
    },

    /* 검 휘두르는 소리 — 화이트노이즈를 대역통과 필터로 빠르게 쓸어내려
       저작권 걱정 없는 절차적 "휙" 소리를 합성한다. */
    playSwordSwing: function () {
      if (!this.ctx || !this._noiseBuffer) return;
      try {
        var ctx = this.ctx;
        var now = ctx.currentTime;

        var src = ctx.createBufferSource();
        src.buffer = this._noiseBuffer;

        var filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 0.9;
        filter.frequency.setValueAtTime(3200, now);
        filter.frequency.exponentialRampToValueAtTime(700, now + 0.14);

        var gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.5, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

        src.connect(filter).connect(gain).connect(ctx.destination);
        src.start(now);
        src.stop(now + 0.2);
      } catch (e) {
        // 무음으로 넘어간다 — 오디오 실패가 게임플레이를 막지 않는다
      }
    },

    /* 모슬링 피격 — 짧고 높은 "톡" 소리. 오실레이터 피치를 빠르게 떨어뜨려
       타격감을 준다 (검 소리와 겹쳐도 구분되도록 노이즈 대신 톤을 사용).
       PHASE 6.1: "탁/착" 하고 걸리는 맛을 더하려고, 톤 앞에 아주 짧은 노이즈
       클릭을 한 겹 더 얹었다 — 타악기의 어택 성분처럼 순간적인 "딱" 임팩트를 준다. */
    playEnemyHit: function () {
      if (!this.ctx) return;
      try {
        var ctx = this.ctx;
        var now = ctx.currentTime;

        // 클릭 레이어 (아주 짧은 노이즈, 어택 성분)
        if (this._noiseBuffer) {
          var click = ctx.createBufferSource();
          click.buffer = this._noiseBuffer;
          var clickFilter = ctx.createBiquadFilter();
          clickFilter.type = 'highpass';
          clickFilter.frequency.value = 1200;
          var clickGain = ctx.createGain();
          clickGain.gain.setValueAtTime(0.28, now);
          clickGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
          click.connect(clickFilter).connect(clickGain).connect(ctx.destination);
          click.start(now);
          click.stop(now + 0.03);
        }

        // 톤 레이어 (기존 — 피치가 빠르게 떨어지는 짧은 사각파)
        var osc = ctx.createOscillator();
        osc.type = 'square';
        osc.frequency.setValueAtTime(520, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);

        var gain = ctx.createGain();
        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.09);

        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.1);
      } catch (e) {
        // 무음으로 넘어간다
      }
    },

    /* 모슬링 처치 — 노이즈가 낮은 쪽으로 흩어지며 잦아드는 "풋" 소리.
       모스(이끼) 생명체가 흩어져 사라지는 이미지에 맞춘 절차적 효과음. */
    playEnemyDefeat: function () {
      if (!this.ctx || !this._noiseBuffer) return;
      try {
        var ctx = this.ctx;
        var now = ctx.currentTime;

        var src = ctx.createBufferSource();
        src.buffer = this._noiseBuffer;

        var filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.Q.value = 0.7;
        filter.frequency.setValueAtTime(1800, now);
        filter.frequency.exponentialRampToValueAtTime(220, now + 0.26);

    overlaps: function (ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

    nearby: function (solids, cx, cy, radius) {

    /* 물 위 반짝임 — 애니메이션이므로 매 프레임 그린다 (보이는 부분만) */
    renderWater: function (ctx, cam, time) {
      var top = Math.max(0, cam.y - 20);
      var bottom = Math.min(MAP_H, cam.y + cam.h + 20);
      if (cam.x > RIVER.x + RIVER.w || cam.x + cam.w < RIVER.x) return;

      ctx.save();
      for (var y = Math.floor(top / 8) * 8; y < bottom; y += 8) {
        var t = time * 0.7 + y * 0.06;
        var sway = Math.sin(t) * 10;
        var alpha = 0.10 + 0.10 * Math.sin(t * 1.7);
        ctx.fillStyle = 'rgba(190, 232, 245, ' + alpha.toFixed(3) + ')';
        ctx.fillRect(RIVER.x + 18 + sway, y, 22, 1);
        ctx.fillRect(RIVER.x + 74 - sway, y + 4, 16, 1);

      ctx.restore();

    /* 반딧불 — 화면 안에 있는 것만 */
    renderFireflies: function (ctx, cam, time) {
      for (var i = 0; i < this.fireflies.length; i++) {
        var f = this.fireflies[i];
        var fx = f.x + Math.sin(time * f.speed + f.phase) * 10;
        var fy = f.y + Math.cos(time * f.speed * 0.8 + f.phase) * 7;
        if (fx < cam.x - 8 || fx > cam.x + cam.w + 8) continue;
        if (fy < cam.y - 8 || fy > cam.y + cam.h + 8) continue;

        var glow = 0.30 + 0.34 * Math.sin(time * 2.2 + f.phase);
        if (glow <= 0.02) continue;

        o = this.trees[i];

        if (o.y < cam.y - 80 || o.y > cam.y + cam.h + 40) continue;
        out.push({ y: o.y, obj: o, kind: 'tree' });
      }
      for (i = 0; i < this.rocks.length; i++) {
        o = this.rocks[i];
        if (o.x < cam.x - 40 || o.x > cam.x + cam.w + 40) continue;
        if (o.y < cam.y - 40 || o.y > cam.y + cam.h + 40) continue;

    },

    renderProp: function (ctx, entry) {
      if (entry.kind === 'tree') this.drawTree(ctx, entry.obj);
      else if (entry.kind === 'rock') this.drawRock(ctx, entry.obj);

    drawTree: function (ctx, t) {
      var x = t.x, y = t.y, s = t.scale;
      var i;

      // 그림자
      ctx.fillStyle = 'rgba(0, 0, 0, 0.34)';
      ctx.beginPath();
      ctx.ellipse(x, y + 2, 11 * s, 4 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      // 밑동 — 캐노피와 확실히 이어지도록 굵고 길게
      var tw = Math.max(4, Math.round(7 * s));
      var trunkTop = y - 17 * s;
      ctx.fillStyle = PALETTE.trunk;
      ctx.fillRect(Math.round(x - tw / 2), Math.round(trunkTop), tw, Math.round(18 * s));
      ctx.fillStyle = PALETTE.trunkDark;
      ctx.fillRect(Math.round(x - tw / 2), Math.round(trunkTop), Math.max(1, Math.round(tw / 3)), Math.round(18 * s));

      // 캐노피 — 원 세 개를 겹쳐 뭉툭한 실루엣을 만든다.
      // 밑동 위에 걸치도록 낮게 앉혀 "떠 있는 공"처럼 보이지 않게 한다.
      var cy = y - 24 * s;
      var lobes = [
        [x - 9 * s, cy + 6 * s, 11.5 * s],
        [x + 9 * s, cy + 5 * s, 10.5 * s],
        [x,         cy - 3 * s, 13.5 * s]
      ];

      // 어두운 테두리 — 풀밭과 대비를 만들어 실루엣을 읽히게 한다
      ctx.fillStyle = '#0d2416';
      for (i = 0; i < lobes.length; i++) {
        ctx.beginPath();
        ctx.arc(lobes[i][0], lobes[i][1], lobes[i][2] + 1.6, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = t.tint > 0.5 ? PALETTE.leafDark : '#20573a';
      for (i = 0; i < lobes.length; i++) {
        ctx.beginPath();
        ctx.arc(lobes[i][0], lobes[i][1], lobes[i][2], 0, Math.PI * 2);
        ctx.fill();
      }

      // 달빛을 받는 윗면
      ctx.fillStyle = PALETTE.leafMid;
      ctx.beginPath();
      ctx.arc(x - 3 * s, cy - 6 * s, 9 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = PALETTE.leafLight;
      ctx.beginPath();
      ctx.arc(x - 5 * s, cy - 9 * s, 5 * s, 0, Math.PI * 2);
      ctx.fill();

      // 잎 결 — 가장자리를 살짝 흩어 딱딱한 원을 깬다
      ctx.fillStyle = 'rgba(13, 36, 22, 0.55)';
      for (i = 0; i < 5; i++) {
        var a = (i / 5) * Math.PI * 2 + t.tint * 3;
        ctx.fillRect(
          Math.round(x + Math.cos(a) * 12 * s),
          Math.round(cy + Math.sin(a) * 9 * s),
          Math.max(1, Math.round(2 * s)),
          Math.max(1, Math.round(2 * s))
        );
      }
    },

    drawRock: function (ctx, r) {
      var x = r.x, y = r.y, s = r.scale;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
      ctx.beginPath();
      ctx.ellipse(x, y + 2, 12 * s, 4 * s, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = PALETTE.rock;
      ctx.beginPath();
      ctx.moveTo(x - 11 * s, y + 2);
      ctx.lineTo(x - 8 * s, y - 9 * s);
      ctx.lineTo(x - 1 * s, y - 13 * s);
      ctx.lineTo(x + 8 * s, y - 8 * s);
      ctx.lineTo(x + 11 * s, y + 2);
      ctx.closePath();
      ctx.fill();

      // 위쪽 밝은 면
      ctx.fillStyle = PALETTE.rockLight;
      ctx.beginPath();
      ctx.moveTo(x - 8 * s, y - 9 * s);
      ctx.lineTo(x - 1 * s, y - 13 * s);
      ctx.lineTo(x + 3 * s, y - 9 * s);
      ctx.lineTo(x - 4 * s, y - 6 * s);
      ctx.closePath();
      ctx.fill();

      // 이끼
      ctx.fillStyle = PALETTE.rockMoss;
      ctx.fillRect(Math.round(x - 6 * s), Math.round(y - 10 * s), Math.round(4 * s), Math.round(2 * s));
      ctx.fillRect(Math.round(x + 2 * s), Math.round(y - 7 * s), Math.round(3 * s), Math.round(2 * s));
    }
  };

  MG.Map = Map;
})(window);

/* ==========================================================================
   input.js — 키보드 / 터치 입력
   PHASE 1 범위: 키 상태 추적과 정규화된 이동 axis
   PHASE 3 범위: 모바일 가상 조이스틱(좌하단) + 공격 버튼 플레이스홀더(우하단)
     - Pointer Events 로 터치/마우스를 동일하게 처리한다
     - 조이스틱은 터치 영역 안 아무 곳이나 짚으면 그 자리에 즉시 나타나는
       "플로팅" 방식이라 반응이 즉각적이다
     - 공격 버튼은 시각적 눌림 상태와 1프레임 엣지 트리거만 제공한다.
       실제 공격 판정(히트박스/데미지)은 PHASE 5 combat.js 의 몫이다.
   ========================================================================== */
(function (global) {
  'use strict';

  var MG = global.MG = global.MG || {};

  // 게임에서 사용하는 키만 브라우저 기본 동작(스크롤 등)을 막는다
  var BLOCKED = {
    ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Space: 1
  };

  var JOY_RADIUS = 40;   // 조이스틱 최대 이동 반경(px, 화면 좌표)
  var JOY_DEADZONE = 6;  // 중심 부근 흔들림 무시 반경(px)

  var Input = {
    keys: {},                  // code -> true/false
    axis: { x: 0, y: 0 },      // 정규화된 이동 입력 (-1 ~ 1), 키보드/터치 통합
    attackPressed: false,      // 공격 버튼이 "이번 프레임에" 눌렸는지 (1프레임 엣지)
    hasTouch: false,

    _joyPointerId: null,
    _joyOriginX: 0,
    _joyOriginY: 0,
    _touchAxis: { x: 0, y: 0 },
    _attackPointerId: null,
    _attackRequested: false,

    init: function () {
      var self = this;

      global.addEventListener('keydown', function (e) {
        if (e.repeat) return;
        self.keys[e.code] = true;
        if (BLOCKED[e.code]) e.preventDefault();
      });

      global.addEventListener('keyup', function (e) {
        self.keys[e.code] = false;
        if (BLOCKED[e.code]) e.preventDefault();
      });

      // 탭 전환 시 키가 눌린 채로 남지 않게 초기화

        if (document.hidden) self.reset();
      });

      this.hasTouch = ('ontouchstart' in global) || navigator.maxTouchPoints > 0;

    },

    reset: function () {

      this.axis.y = 0;
      this._touchAxis.x = 0;
      this._touchAxis.y = 0;
      this._joyPointerId = null;
      this._attackPointerId = null;
      this._attackRequested = false;

      this.setAttackPressedVisual(false);
    },

    isDown: function (code) {

    /* -------------------------------------------------------- 터치 컨트롤 */
    initTouchControls: function () {
      var self = this;
      this.el = {
        zone: document.getElementById('joystick-zone'),
        base: document.getElementById('joystick-base'),
        knob: document.getElementById('joystick-knob'),
        attackBtn: document.getElementById('btn-attack')

      if (!this.el.zone || !this.el.attackBtn) return;

      this.el.zone.addEventListener('pointerdown', function (e) {
        if (self._joyPointerId !== null) return; // 이미 다른 손가락이 조작 중

        self._joyOriginX = e.clientX;
        self._joyOriginY = e.clientY;

        self.updateJoystick(e.clientX, e.clientY);

        self.updateJoystick(e.clientX, e.clientY);
        e.preventDefault();
      });

        self._touchAxis.y = 0;
        self.hideJoystick();
      };
      this.el.zone.addEventListener('pointerup', releaseJoystick);
      this.el.zone.addEventListener('pointercancel', releaseJoystick);

      this.el.attackBtn.addEventListener('pointerdown', function (e) {
        if (self._attackPointerId !== null) return;
        self._attackPointerId = e.pointerId;
        self._attackRequested = true;
        self.setAttackPressedVisual(true);
        if (self.el.attackBtn.setPointerCapture) {
          try { self.el.attackBtn.setPointerCapture(e.pointerId); } catch (err) {}
        }
        e.preventDefault();
      });

      var releaseAttack = function (e) {
        if (e.pointerId !== self._attackPointerId) return;
        self._attackPointerId = null;
        self.setAttackPressedVisual(false);
      };
      this.el.attackBtn.addEventListener('pointerup', releaseAttack);
      this.el.attackBtn.addEventListener('pointercancel', releaseAttack);
    },

    showJoystickAt: function (x, y) {
      if (!this.el || !this.el.base) return;
      this.el.base.style.left = x + 'px';
      this.el.base.style.top = y + 'px';
      this.el.base.hidden = false;
    },

    hideJoystick: function () {
      if (!this.el || !this.el.base || !this.el.knob) return;
      this.el.base.hidden = true;
      this.el.knob.style.transform = 'translate(0px, 0px)';
    },

    updateJoystick: function (x, y) {
      var dx = x - this._joyOriginX;
      var dy = y - this._joyOriginY;
      var dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < JOY_DEADZONE) {
        this._touchAxis.x = 0;
        this._touchAxis.y = 0;
        if (this.el && this.el.knob) this.el.knob.style.transform = 'translate(0px, 0px)';
        return;
      }

      var clamped = Math.min(dist, JOY_RADIUS);
      var nx = dx / dist;
      var ny = dy / dist;
      var kx = nx * clamped;
      var ky = ny * clamped;

      this._touchAxis.x = kx / JOY_RADIUS;
      this._touchAxis.y = ky / JOY_RADIUS;

      if (this.el && this.el.knob) {
        this.el.knob.style.transform = 'translate(' + kx.toFixed(1) + 'px, ' + ky.toFixed(1) + 'px)';
      }
    },

    setAttackPressedVisual: function (pressed) {
      if (this.el && this.el.attackBtn) {
        this.el.attackBtn.classList.toggle('is-pressed', pressed);
      }
    },

    /* 매 프레임 이동 입력을 갱신 (player.js 가 axis 를, 이후 combat.js 가
       attackPressed 를 사용한다) */
    update: function () {
      var kx = 0, ky = 0;
      if (this.isDown('KeyA') || this.isDown('ArrowLeft'))  kx -= 1;
      if (this.isDown('KeyD') || this.isDown('ArrowRight')) kx += 1;
      if (this.isDown('KeyW') || this.isDown('ArrowUp'))    ky -= 1;
      if (this.isDown('KeyS') || this.isDown('ArrowDown'))  ky += 1;

      // 대각선 이동이 빨라지지 않도록 정규화
      if (kx !== 0 && ky !== 0) {
        var inv = Math.SQRT1_2;
        kx *= inv;
        ky *= inv;
      }

      var joyActive = this._joyPointerId !== null;
      this.axis.x = joyActive ? this._touchAxis.x : kx;
      this.axis.y = joyActive ? this._touchAxis.y : ky;

      var spaceEdge = this.isDown('Space') && !this._spaceWasDown;
      this._spaceWasDown = this.isDown('Space');

      this.attackPressed = this._attackRequested || spaceEdge;
      this._attackRequested = false;
    }
  };

  MG.Input = Input;
})(window);

/* ==========================================================================
   combat.js — 공격 상태 진행 / 히트박스 / 디버그 시각화
   PHASE 5 범위:
     - 공격 지속시간 / 쿨다운을 델타타임으로 진행 (프레임수 의존 없음)
     - 방향은 공격 시작 순간의 facing 에 고정된다 (스윙 도중 방향 전환 없음)
     - 히트박스는 플레이어의 "월드" 좌표 기준으로 계산한다 (화면 좌표 아님) —
       PHASE 6 에서 모슬링과의 충돌 판정이 그대로 재사용한다.
   PHASE 6 범위:
     - player.attackId 를 스윙마다 1씩 올린다. enemy.js 는 모슬링별로
       "마지막으로 맞은 attackId" 를 기억해두고 비교하는 방식으로 같은 스윙이
       한 모슬링을 여러 프레임에 걸쳐 중복으로 때리지 못하게 막는다
       (프레임 타이밍이 아니라 스윙 단위 식별자로 판정하기 위함).
   상태 자체(attacking/attackFacing/attackT/cooldownT/attackId)는 player.js 가
   들고 있고, 이 파일은 그 상태를 "어떻게 진행시키고 어떻게 히트박스로 변환할지"만
   담당한다.
   ========================================================================== */
(function (global) {
  'use strict';
  var MG = global.MG = global.MG || {};

  var ATTACK_DURATION = 0.22;   // 초 — 스윙 전체 지속시간
  var ATTACK_COOLDOWN  = 0.30;  // 초 — 스윙이 끝난 뒤 다음 공격까지 대기
  var MOVE_MULTIPLIER  = 0.7;   // 공격 중 이동속도 배율 (0.65~0.75 권장 범위)

  // 스윙 지속시간 중 실제로 타격 판정이 살아있는 구간 (앞뒤로 예비/회수 동작을 남긴다)
  var HITBOX_ACTIVE_FROM = 0.28;  // attackT/ATTACK_DURATION 비율 (0~1)
  var HITBOX_ACTIVE_TO   = 0.82;

  var REACH = 14;   // 전방으로 뻗는 길이
  var WIDE  = 15;   // 진행축과 수직인 폭 (몸통 폭 ~12보다 살짝 넓게)
  var GAP   = 3;    // 몸에서 살짝 띄우는 간격 (칼이 몸 밖에서 시작하는 느낌)

  // true 로 바꾸면 히트박스 사각형과 공격 상태 텍스트를 월드 위에 그려서 확인할 수 있다
  var DEBUG_COMBAT = false;

  var Combat = {
    ATTACK_DURATION: ATTACK_DURATION,
    ATTACK_COOLDOWN: ATTACK_COOLDOWN,
    MOVE_MULTIPLIER: MOVE_MULTIPLIER,
    DEBUG_COMBAT: DEBUG_COMBAT,

    /* player.js 가 매 프레임 호출해 공격/쿨다운 타이머를 진행시킨다.
       공격을 "시작할지"는 판단하지 않는다 — 그건 입력을 아는 player.js 의 몫이다. */
    advance: function (player, dt) {
      if (player.attacking) {
        player.attackT += dt;
        if (player.attackT >= ATTACK_DURATION) {
          player.attacking = false;
          player.attackT = 0;
          player.cooldownT = ATTACK_COOLDOWN;

      } else if (player.cooldownT > 0) {
        player.cooldownT -= dt;
        if (player.cooldownT < 0) player.cooldownT = 0;
      }
    },

    /* 지금 새 공격을 시작할 수 있는 상태인가 (스팸 방지) */
    canAttack: function (player) {

    },

    /* 공격을 시작한다 — 방향을 이 순간의 facing 에 고정한다 */
    startAttack: function (player) {
      player.attacking = true;
      player.attackFacing = player.facing;
      player.attackT = 0;
      player.attackId = (player.attackId || 0) + 1;
      if (MG.Audio && MG.Audio.playSwordSwing) MG.Audio.playSwordSwing();
    },

    /* 현재 스윙 진행도(0~1) 중 실제로 타격 판정이 살아있는 구간인가 */
    isHitboxActive: function (player) {
      if (!player.attacking) return false;
      var p = player.attackT / ATTACK_DURATION;

       활성 구간이 아니면 null (PHASE 6 에서 "null 이면 판정 없음"으로 바로 쓸 수 있다). */
    getAttackHitbox: function (player) {
      if (!this.isHitboxActive(player)) return null;

      var cx = player.x;
      var cy = player.y - 10;   // 대략 몸통 중심 높이 (발이 아니라 허리 쯤)
      var dir = player.attackFacing;
      var w, h, x, y;

      if (dir === 'up') {
        w = WIDE; h = REACH;
        x = cx - w / 2; y = cy - GAP - h;
      } else if (dir === 'down') {
        w = WIDE; h = REACH;
        x = cx - w / 2; y = cy + GAP;
      } else if (dir === 'left') {
        w = REACH; h = WIDE;
        x = cx - GAP - w; y = cy - h / 2;
      } else { // right
        w = REACH; h = WIDE;
        x = cx + GAP; y = cy - h / 2;
      }
      return { x: x, y: y, w: w, h: h };
    },

    /* DEBUG_COMBAT 이 true 일 때만 game.js 가 (카메라 변환이 적용된 상태로) 호출한다. */
    renderDebug: function (ctx, player) {

/* ==========================================================================
   player.js — 플레이어(LUKA) 이동 / 방향 / 걷기 애니메이션 / 검 공격
   PHASE 2 범위:
     - 부드러운 8방향 이동 (input.js 의 정규화된 axis 사용)
     - 4방향 facing (상/하/좌/우) — 공격 방향의 기준이 된다
     - 절차적으로 그린 원본 캐릭터 (이끼/덩굴 숲 탐험가, 둥근 여행 가방)
   PHASE 5 범위:
     - 공격 상태(attacking/attackFacing/attackT/cooldownT)를 들고,
       진행/판정은 combat.js 에 위임한다 (state 는 여기, 로직은 combat.js)
     - 공격 중에는 이동은 가능하지만 느려지고, facing 전환은 멈춘다
       (스윙 도중 캐릭터가 다른 방향을 보지 않도록)
     - 몸통 렌더링 위에 검 스윙 오버레이를 덧그린다

(function (global) {
  'use strict';

  var MG = global.MG = global.MG || {};

  var SPEED = 84;          // 내부 픽셀/초
  var FOOT_W = 11;         // 충돌 상자 (발치) — 캐릭터 전체가 아니라 발만 막는다
  var FOOT_H = 6;
  var STEP_FREQ = 9;        // 걷기 사이클 속도
  var IDLE_FREQ = 1.6;      // 정지 시 미세한 흔들림 속도

  // PHASE 6.2: 모슬링 돌진이 플레이어에게 닿았을 때의 피드백 (체력/데미지 없음 —
  // "적이 나에게 닿았다"만 전달하는 연출용 수치).
  var CONTACT_FLASH_DURATION = 0.08;   // 초 (권장 0.06~0.10)
  var CONTACT_KNOCKBACK_DIST = 5;      // 세계 픽셀 (권장 4~6)
  var CONTACT_HITSTOP = 0.04;          // 초 (권장 0.03~0.05)

  // LUKA 고유 팔레트 — 기존 판타지 캐릭터와 겹치지 않는 배색
  var C = {
    skin:        '#e8b98a',
    hair:        '#3b2a20',
    hairShade:   '#241a14',
    tunic:       '#2e6b6e',   // 청록 (링의 초록 튜닉과 구분되는 색)
    tunicShade:  '#1c4547',
    cape:        '#9a3f3f',   // 따뜻한 다갈색 망토
    capeShade:   '#712d2d',
    satchel:     '#b98a52',   // 둥근 여행 가방
    satchelShade:'#8a6236',
    sword:       '#dbe2e8',
    swordShade:  '#8f98a3',
    hilt:        '#5b3a22',
    outline:     'rgba(10, 8, 6, 0.55)'
  };

  function rect(ctx, x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  var Player = {
    x: 0, y: 0,             // 발 중심 좌표 (내부 해상도 기준)
    facing: 'down',         // 'up' | 'down' | 'left' | 'right'
    moving: false,
    animT: 0,

    // PHASE 5: 공격 상태. 진행/판정은 combat.js 가 담당하고 여기서는 값만 들고 있는다.
    attacking: false,
    attackFacing: 'down',   // 공격이 시작된 순간의 facing 에 고정
    attackT: 0,             // 현재 스윙 경과 시간(초)
    cooldownT: 0,           // 다음 공격까지 남은 대기 시간(초)
    attackId: 0,            // PHASE 6: 스윙마다 1씩 증가 — 모슬링의 중복 피격 방지용 식별자

    hitFlashT: 0,            // PHASE 6.2: 모슬링 돌진에 닿았을 때의 짧은 플래시 (체력 아님)

    FOOT_W: FOOT_W,
    FOOT_H: FOOT_H,

    init: function () {
      var spawn = (MG.Map && MG.Map.spawn) || { x: 200, y: 706 };
      this.x = spawn.x;
      this.y = spawn.y;
      this.facing = 'down';
      this.moving = false;
      this.animT = 0;
      this.attacking = false;
      this.attackFacing = 'down';
      this.attackT = 0;
      this.cooldownT = 0;
      this.attackId = 0;
      this.hitFlashT = 0;
    },

    /* 전투용 허트박스 — enemy.js 의 getHurtbox() 와 같은 개념(발치 이동 충돌과는
       별개). 모슬링의 돌진이 "몸에 닿았는지" 판정할 때 사용한다. */
    getHurtbox: function () {
      return { x: this.x - 6, y: this.y - 16, w: 12, h: 16 };
    },

    /* PHASE 6.2: 모슬링 돌진이 닿았을 때 enemy.js 가 호출한다.
       체력/데미지는 없다 — "적이 닿았다" 를 알리는 순수 연출: 살짝 밀려나고,
       짧게 붉게 번쩍이고, 아주 잠깐 히트스탑이 걸리고, 소리가 난다.
       조이스틱/공격 입력은 이 흐름에서 전혀 건드리지 않으므로 즉시 조작 가능하다. */
    onContactHit: function (fromX, fromY) {
      var dx = this.x - fromX, dy = this.y - fromY;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = dx / dist, ny = dy / dist;

      var solids = (MG.Map && MG.Map.solids) || [];
      if (MG.Collision && solids.length) {
        var res = MG.Collision.moveAndCollide(
          this.x, this.y, FOOT_W, FOOT_H,
          nx * CONTACT_KNOCKBACK_DIST, ny * CONTACT_KNOCKBACK_DIST, solids
        );
        this.x = res.x;
        this.y = res.y;
      } else {
        this.x += nx * CONTACT_KNOCKBACK_DIST;
        this.y += ny * CONTACT_KNOCKBACK_DIST;
      }

      this.hitFlashT = CONTACT_FLASH_DURATION;
      if (MG.Game && MG.Game.hitStop) MG.Game.hitStop(CONTACT_HITSTOP);
      if (MG.Audio && MG.Audio.playPlayerContact) MG.Audio.playPlayerContact();
    },

    update: function (dt) {
      this.animT += dt;
      this.hitFlashT = Math.max(0, this.hitFlashT - dt);

      var canMove = MG.Game && MG.Game.state === 'PLAY';

      // 공격 타이머 진행 (시작 여부와 무관하게 매 프레임 돌아간다)
      if (MG.Combat && MG.Combat.advance) MG.Combat.advance(this, dt);

      // 공격 입력: PLAY 상태에서만, 그리고 스팸 방지(공격 중/쿨다운 중엔 무시)
      if (canMove && MG.Input && MG.Input.attackPressed &&
          MG.Combat && MG.Combat.canAttack && MG.Combat.canAttack(this)) {
        MG.Combat.startAttack(this);
      }

      var axis = (MG.Input && MG.Input.axis) || { x: 0, y: 0 };
      var ax = canMove ? axis.x : 0;
      var ay = canMove ? axis.y : 0;

      this.moving = (ax !== 0 || ay !== 0);

      if (this.moving) {
        // 공격 중에는 완전히 멈추지 않되 느려진다 (모바일에서도 계속 조작 가능해야 한다)
        var speedMul = (this.attacking && MG.Combat) ? MG.Combat.MOVE_MULTIPLIER : 1;

        // 대각선 이동이 더 빠르지 않도록 input.js 에서 이미 정규화되어 있다
        var dx = ax * SPEED * speedMul * dt;
        var dy = ay * SPEED * speedMul * dt;

        var solids = (MG.Map && MG.Map.solids) || [];
        if (MG.Collision && solids.length) {
          var res = MG.Collision.moveAndCollide(this.x, this.y, FOOT_W, FOOT_H, dx, dy, solids);
          this.x = res.x;
          this.y = res.y;
        } else {
          this.x += dx;
          this.y += dy;
        }

        // 공격 중에는 facing 을 고정한다 — 스윙 도중 캐릭터가 방향을 바꾸면
        // "이 스윙은 끝까지 한 방향" 이라는 규칙이 시각적으로 깨진다.
        if (!this.attacking) {
          if (Math.abs(ax) > Math.abs(ay)) {

          } else {
            this.facing = ay > 0 ? 'down' : 'up';
          }
        }
      }
    },

    /* ---------------------------------------------------------- render */
    render: function (ctx) {
      var cx = this.x;
      var feetY = this.y;

      var stepPhase = Math.sin(this.animT * STEP_FREQ);
      var bob, stepOffset;

      if (this.moving) {
        bob = Math.abs(stepPhase) * 1.4;
        stepOffset = stepPhase * 2.2;
      } else {
        bob = Math.sin(this.animT * IDLE_FREQ) * 0.4;
        stepOffset = 0;
      }

      // 부드러운 그림자 (지면에 고정, 발 위치 기준)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
      ctx.beginPath();
      ctx.ellipse(Math.round(cx), Math.round(feetY + 1), 5, 2, 0, 0, Math.PI * 2);
      ctx.fill();

      var topY = feetY - bob;

      // 공격 중에는 스윙이 시작된 순간의 방향을 그대로 그린다 (facing 이 아니라 attackFacing)
      var renderFacing = this.attacking ? this.attackFacing : this.facing;

      if (renderFacing === 'down') this.drawFront(ctx, cx, topY, stepOffset, this.attacking);
      else if (renderFacing === 'up') this.drawBack(ctx, cx, topY, stepOffset, this.attacking);
      else this.drawSide(ctx, cx, topY, stepOffset, renderFacing === 'right', this.attacking);

      if (this.attacking && MG.Combat) {
        var progress = this.attackT / MG.Combat.ATTACK_DURATION;
        this.drawAttackSwing(ctx, cx, topY, renderFacing, progress);
      }

      // PHASE 6.2: 모슬링 접촉 플래시 — 팔레트를 바꾸지 않는 옅은 오버레이라
      // 잠깐 번쩍이고 사라진다 (체력 시스템이 아니라 순수 연출)
      if (this.hitFlashT > 0) {
        var flashA = (this.hitFlashT / CONTACT_FLASH_DURATION) * 0.55;
        ctx.fillStyle = 'rgba(255, 80, 80, ' + flashA.toFixed(2) + ')';
        ctx.beginPath();
        ctx.ellipse(Math.round(cx), Math.round(topY - 11), 8, 12, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    },

    /* 정면(아래를 바라봄) */
    drawFront: function (ctx, cx, feetY, step, attacking) {

      // 망토 (몸통 뒤로 살짝 보임)
      rect(ctx, cx - 6, feetY - 15, 3, 9, C.capeShade);
      rect(ctx, cx + 3, feetY - 15, 3, 9, C.capeShade);

      // 다리 (걷기 사이클에 따라 번갈아 이동)
      rect(ctx, cx - 4, feetY - 5 - Math.max(0, step), 3, 5, C.tunicShade);
      rect(ctx, cx + 1, feetY - 5 + Math.max(0, -step), 3, 5, C.tunicShade);

      // 몸통(튜닉)
      rect(ctx, cx - 5, feetY - 14, 10, 10, C.tunic);
      rect(ctx, cx - 5, feetY - 6, 10, 2, C.tunicShade);

      // 여행 가방 (허리 오른쪽, 둥근 실루엣)
      ctx.fillStyle = C.satchel;
      ctx.beginPath();
      ctx.arc(Math.round(cx + 5), Math.round(feetY - 9), 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.satchelShade;
      ctx.fillRect(Math.round(cx + 4), Math.round(feetY - 8), 3, 1);

      // 검(허리에 소지, 공격 중이 아닐 때만 — 공격 중엔 drawAttackSwing 이 대신 그린다)

        rect(ctx, cx - 7, feetY - 10, 2, 6, C.swordShade);
        rect(ctx, cx - 8, feetY - 11, 3, 2, C.hilt);
      }

      // 팔
      rect(ctx, cx - 6, feetY - 13, 2, 6, C.tunic);
      rect(ctx, cx + 4, feetY - 13, 2, 6, C.tunic);

      // 머리
      ctx.fillStyle = C.skin;
      ctx.beginPath();
      ctx.arc(Math.round(cx), Math.round(feetY - 18), 4, 0, Math.PI * 2);
      ctx.fill();

      rect(ctx, cx - 4, feetY - 22, 8, 3, C.hair);
      rect(ctx, cx - 5, feetY - 20, 2, 4, C.hair);
      rect(ctx, cx + 3, feetY - 20, 2, 4, C.hair);

      // 눈
      rect(ctx, cx - 2, feetY - 18, 1, 1, C.outline);
      rect(ctx, cx + 1, feetY - 18, 1, 1, C.outline);
    },

    /* 뒷모습(위를 바라봄) */
    drawBack: function (ctx, cx, feetY, step, attacking) {
      // 다리
      rect(ctx, cx - 4, feetY - 5 - Math.max(0, step), 3, 5, C.tunicShade);
      rect(ctx, cx + 1, feetY - 5 + Math.max(0, -step), 3, 5, C.tunicShade);

      // 망토 (등 전체를 덮는 주 실루엣)
      rect(ctx, cx - 6, feetY - 16, 12, 11, C.cape);
      rect(ctx, cx - 6, feetY - 7, 12, 2, C.capeShade);

      // 팔
      rect(ctx, cx - 7, feetY - 13, 2, 6, C.tunicShade);
      rect(ctx, cx + 5, feetY - 13, 2, 6, C.tunicShade);

      // 검자루(같은 손 — 정면 idle 검의 반대쪽. 정면에서 오른손이 화면 왼쪽(cx-7)에
      // 보이므로, 몸을 반대로 돌린 뒷모습에서는 같은 오른손이 화면 오른쪽에 보인다.
      // 칼날은 망토에 가려지므로 손잡이만 살짝 내비친다. 공격 중엔 drawAttackSwing 이 대신 그린다)
      if (!attacking) {
        rect(ctx, cx + 6, feetY - 12, 3, 2, C.hilt);
      }

      // 머리 (뒤통수 + 머리카락 전체)
      ctx.fillStyle = C.skin;
      ctx.beginPath();
      ctx.arc(Math.round(cx), Math.round(feetY - 18), 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.hair;
      ctx.beginPath();
      ctx.arc(Math.round(cx), Math.round(feetY - 19), 4, 0, Math.PI * 2);
      ctx.fill();
      rect(ctx, cx - 4, feetY - 15, 8, 3, C.hairShade);
    },

    /* 옆모습 (facingRight=true 면 오른쪽, false 면 왼쪽으로 좌우 반전) */
    drawSide: function (ctx, cx, feetY, step, facingRight, attacking) {
      var dir = facingRight ? 1 : -1;

      // 망토 (진행 방향 반대쪽으로 흩날림)
      rect(ctx, cx - dir * 6, feetY - 16, 4, 10, C.capeShade);

      // 뒷다리 / 앞다리
      rect(ctx, cx - dir * 2 - 1, feetY - 5 - Math.max(0, step), 3, 5, C.tunicShade);
      rect(ctx, cx + dir * 1 - 1, feetY - 5 + Math.max(0, -step), 3, 5, C.tunicShade);

      // 몸통
      rect(ctx, cx - 4, feetY - 14, 8, 10, C.tunic);
      rect(ctx, cx - 4, feetY - 6, 8, 2, C.tunicShade);

      // 여행 가방 (등 쪽)
      ctx.fillStyle = C.satchel;
      ctx.beginPath();
      ctx.arc(Math.round(cx - dir * 4), Math.round(feetY - 10), 3, 0, Math.PI * 2);
      ctx.fill();

      // 앞팔
      rect(ctx, cx + dir * 3, feetY - 13, 2, 6, C.tunic);

      // 검(허리 소지, 공격 중이 아닐 때만)
      if (!attacking) {
        rect(ctx, cx + dir * 4, feetY - 10, 2, 5, C.swordShade);
        rect(ctx, cx + dir * 3, feetY - 11, 3, 2, C.hilt);
      }

      // 머리
      ctx.fillStyle = C.skin;
      ctx.beginPath();
      ctx.arc(Math.round(cx), Math.round(feetY - 18), 4, 0, Math.PI * 2);
      ctx.fill();

      // 앞머리 (진행 방향 쪽으로 쏠린 헤어스타일)
      rect(ctx, cx - 4, feetY - 22, 8, 3, C.hair);
      rect(ctx, cx + dir * 3, feetY - 21, 2, 4, C.hair);

      // 눈 (진행 방향 쪽에 1개만 — 옆얼굴)
      rect(ctx, cx + dir * 2, feetY - 18, 1, 1, C.outline);
    },

    /* PHASE 5 검 스윙 / PHASE 6.1 가독성 보강.
       정적인 칼이 아니라 호를 그리며 휘두르는 느낌을 주기 위해, 매 프레임
       현재 진행도(progress 0~1)에서의 칼날 각도와 잔상용 이전 각도 여러 개를
       옅게 겹쳐 그린다. 추가로 스윙이 "지금까지 쓸고 지나간 부채꼴"을 옅게
       채워, 칼날이 스쳐가는 순간의 궤적뿐 아니라 "대략 이만큼 닿는다"는
       사거리 자체가 눈에 남도록 한다 (PHASE 6.1: 사거리 가독성 피드백 —
       DEBUG_COMBAT 의 사각형 판정 표시와는 다른, 항상 켜져 있는 연출용 효과).
       dir 은 combat.js 의 히트박스 방향과 같은 값을 쓴다 (up/down/left/right). */
    drawAttackSwing: function (ctx, cx, feetY, dir, progress) {
      var t = progress < 0 ? 0 : (progress > 1 ? 1 : progress);

      // 방향별 기준각(캔버스 기준: 0=오른쪽, +=시계방향) + 칼을 쥔 손 근처 피벗.
      // 항상 "같은 손"(정면 idle 기준 화면 왼쪽 = LUKA 의 오른손)에서 칼이 나가야
      // 공격이 시작될 때 손이 바뀐 것처럼 보이지 않는다. down 은 drawFront 의 idle
      // 검(cx-7 부근)과, up 은 drawBack 의 idle 손잡이(cx+6 부근, 몸이 반대로 돌아
      // 있으므로 반대쪽)와 같은 쪽으로 맞춘다. left/right 는 drawSide 의 "전방 팔"
      // 관례를 그대로 따르므로(이미 같은 쪽) 여기서 바꾸지 않는다.
      var baseAngle, pivotX, pivotY;
      if (dir === 'right') { baseAngle = 0;              pivotX = cx + 5;  pivotY = feetY - 10; }
      else if (dir === 'left') { baseAngle = Math.PI;    pivotX = cx - 5;  pivotY = feetY - 10; }
      else if (dir === 'down') { baseAngle = Math.PI / 2; pivotX = cx - 5; pivotY = feetY - 10; }
      else /* up */             { baseAngle = -Math.PI / 2; pivotX = cx + 5; pivotY = feetY - 12; }

      var sweep = (100 * Math.PI) / 180;   // 전체로 휘두르는 각도(호)
      var startAngle = baseAngle - sweep / 2;

        // homeDist 조건이 없으면: 이미 홈 리쉬 밖으로 밀려난(넉백 등으로) 모슬링이
        // WANDER 로 돌아가는 도중에도 플레이어가 근처면 매 프레임 다시 CHASE 로
        // 튕겨 들어왔다가 즉시 홈 리쉬 초과로 다시 WANDER 로 튕겨나가길 반복해
        // (매 프레임 CHASE↔WANDER 떨림) 홈으로 돌아가지 못하게 된다.
        e.state = 'CHASE';
        e.chasePhase = 'approach';
        e.chaseSubT = 0;
      }
    },

    /* PHASE 6.1: CHASE 는 이제 세 하위 단계를 순환한다.
         approach — 플레이어를 향해 평소 속도로 접근한다.
         windup   — LUNGE_TRIGGER_DIST 안까지 붙으면 제자리에서 잠깐 웅크린다
                    (이동 없음 — 플레이어가 "온다"를 읽고 피할 시간을 준다).
         lunge    — 웅크림이 끝난 순간의 방향으로 짧고 빠르게 돌진한 뒤 approach 로
                    돌아가고, 쿨다운 동안은 다시 윈드업하지 않는다.
       플레이어를 때리지는 않는다 — 그저 움직여서 반응하게 만드는 압박 연출이다. */
    updateChase: function (e, dt, player) {
      if (e.lungeCooldownT > 0) e.lungeCooldownT -= dt;

      var dx = player.x - e.x, dy = player.y - e.y;
      var dist = Math.sqrt(dx * dx + dy * dy);

      if (e.chasePhase === 'windup') {
        e.chaseSubT -= dt;
        if (e.chaseSubT <= 0) {
          e.chasePhase = 'lunge';
          e.chaseSubT = LUNGE_DURATION;
          e.lungeContactDone = false; // 새 돌진 시작 — 접촉 판정을 다시 허용한다
          var d = dist || 1;
          e.lungeDX = dx / d;
          e.lungeDY = dy / d;
        }
        return; // 웅크리는 동안은 움직이지 않는다 — 예비 동작을 읽을 시간
      }

      if (e.chasePhase === 'lunge') {
        e.chaseSubT -= dt;

        // PHASE 6.2 POLISH: 직전 프레임에 접촉이 이미 확정됐다면(checkPlayerContact
        // 가 발동해 lungeContactDone 이 true 가 됐다면) 더 이상 파고들지 않고 바로
        // 끝낸다. 그렇지 않으면 넉백으로 막 벌어진 거리를 같은 돌진이 곧바로 다시
        // 따라가 메꿔버려 "접촉 후에는 떨어져 있어야 한다"는 의도가 깨진다.
        if (e.lungeContactDone) {
          e.chasePhase = 'approach';
          e.lungeCooldownT = LUNGE_COOLDOWN;
          return;
        }

        var lungeSpeed = LUNGE_DIST / LUNGE_DURATION;
        var stepX = e.lungeDX * lungeSpeed * dt;
        var stepY = e.lungeDY * lungeSpeed * dt;

        // PHASE 6.2 POLISH: 이번 프레임 이동이 플레이어를 뚫고 지나가 버릴 만큼
        // 크면(플레이어가 가만히 있거나 돌진 시작 시점에 이미 가까웠던 경우),
        // LUNGE_CONTACT_DIST 지점에서 멈추도록 이번 스텝만 줄인다. 그 지점은
        // 허트박스가 이미 겹치는 거리라 아래의 기존 접촉 판정이 그대로 발동한다.
        var curDist = Math.sqrt(dx * dx + dy * dy);
        var stepLen = Math.sqrt(stepX * stepX + stepY * stepY);
        var reachedContact = (curDist - stepLen) < LUNGE_CONTACT_DIST;
        if (reachedContact && stepLen > 0.0001) {
          var allowed = Math.max(0, curDist - LUNGE_CONTACT_DIST);
          var k = allowed / stepLen;
          stepX *= k;
          stepY *= k;
        }

        this.moveWithCollision(e, stepX, stepY);
        if (Math.abs(e.lungeDX) > 0.2) e.facingSign = e.lungeDX > 0 ? 1 : -1;
        if (reachedContact || e.chaseSubT <= 0) {
          e.chasePhase = 'approach';
          e.lungeCooldownT = LUNGE_COOLDOWN;
        }
        return;
      }

      // approach (기본 하위 단계)
      if (dist < 0.001) return;
      if (dist <= LUNGE_TRIGGER_DIST && e.lungeCooldownT <= 0) {
        e.chasePhase = 'windup';
        e.chaseSubT = WINDUP_DURATION;
        return;
      }

      // PHASE 6.2 POLISH: 돌진 쿨다운이 남아있으면 윈드업으로 넘어가지 못한 채
      // 계속 다가오기만 해서 플레이어 위치에 완전히 겹쳐버릴 수 있었다.
      // CHASE_STOP_DIST 안까지 오면 더 다가오지 않고 그 거리에서 플레이어를
      // 바라보며 멈춘다 — 쿨다운이 끝나면 이 상태에서 바로 윈드업으로 전환된다.
      if (dist <= CHASE_STOP_DIST) {
        if (Math.abs(dx) > 0.5) e.facingSign = dx > 0 ? 1 : -1;
        return;
      }

      var mx = (dx / dist) * CHASE_SPEED * dt;
      var my = (dy / dist) * CHASE_SPEED * dt;
      this.moveWithCollision(e, mx, my);
      if (Math.abs(dx) > 0.5) e.facingSign = dx > 0 ? 1 : -1;
    },

    updateWanderOrIdle: function (e, dt) {
      if (e.state === 'IDLE') {
        e.stateT -= dt;
        if (e.stateT <= 0) {
          e.state = 'WANDER';
          this.pickWanderTarget(e);
        }
        return;
      }

      // WANDER: 목표점을 향해 천천히 이동, 도착하거나 시간 초과되면 다시 IDLE
      e.stateT -= dt;
      var dx = e.wanderTX - e.x, dy = e.wanderTY - e.y;
      var dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < 3 || e.stateT <= 0) {
        e.state = 'IDLE';
        e.stateT = IDLE_MIN + Math.random() * (IDLE_MAX - IDLE_MIN);
        return;
      }

      var mx = (dx / dist) * WANDER_SPEED * dt;
      var my = (dy / dist) * WANDER_SPEED * dt;
      this.moveWithCollision(e, mx, my);
      if (Math.abs(dx) > 0.5) e.facingSign = dx > 0 ? 1 : -1;
    },

    pickWanderTarget: function (e) {
      var ang = Math.random() * Math.PI * 2;
      var r = Math.random() * WANDER_LEASH;
      e.wanderTX = e.homeX + Math.cos(ang) * r;
      e.wanderTY = e.homeY + Math.sin(ang) * r;
      e.stateT = WANDER_MIN + Math.random() * (WANDER_MAX - WANDER_MIN);
    },

    moveWithCollision: function (e, dx, dy) {
      var solids = (MG.Map && MG.Map.solids) || [];
      if (MG.Collision && solids.length) {
        var res = MG.Collision.moveAndCollide(e.x, e.y, FOOT_W, FOOT_H, dx, dy, solids);
        e.x = res.x;
        e.y = res.y;
      } else {
        e.x += dx;
        e.y += dy;
      }
    },

    updateHit: function (e, dt) {
      e.hitFlashT = Math.max(0, e.hitFlashT - dt);
      e.stateT -= dt;

      // 넉백은 순간 충격이 아니라 knockDuration 동안 밀려나는 짧은 이동으로 구현한다 —
      // 그래야 벽/나무에 부딪히면 그 자리에서 자연스럽게 멈춘다 (기존 충돌 재사용)
      if (e.stateT > 0) {
        this.moveWithCollision(e, e.knockVX * dt, e.knockVY * dt);
      } else {
        e.state = 'WANDER';
        this.pickWanderTarget(e);
      }
    },

    updateDead: function (e, dt) {
      e.deathT -= dt;
      e.hitFlashT = Math.max(0, e.hitFlashT - dt); // 즉사 타격의 플래시도 끝까지 재생되게 한다
    },

    /* 전투용 허트박스 — 이동 충돌(footRect, 발치만)과는 별개의 개념이다.
       검은 허리~머리 높이를 스치는데 footRect 는 발 밑 6px 짜리 얇은 판정이라,
       칼날이 눈으로 보기엔 몸통에 꽂혀도 수학적으로는 비껴가는 문제가 있었다.
       drawBody() 의 몸통 로브는 대략 y-10.6 ~ y+1.2, x-7.7 ~ x+7.3 범위를 차지하므로
       그 몸통 전체를 넉넉히 덮는 상자를 따로 둔다. */
    getHurtbox: function (e) {
      return { x: e.x - 6, y: e.y - 12, w: 12, h: 12 };
    },

    /* ------------------------------------------------------ 검 판정 연결 */
    checkSwordHit: function (e, player) {
      if (e.state === 'DEAD') return;
      if (player.attackId === e.lastHitAttackId) return; // 이 스윙으로는 이미 맞았다

      var box = MG.Combat && MG.Combat.getAttackHitbox ? MG.Combat.getAttackHitbox(player) : null;
      if (!box) return;

      var hurt = this.getHurtbox(e);
      if (!MG.Collision.overlaps(box.x, box.y, box.w, box.h, hurt.x, hurt.y, hurt.w, hurt.h)) return;

      this.applyHit(e, player);
    },

    /* PHASE 6.1: "칼이 닿았다" 는 확신을 주기 위한 타격 확인 시퀀스.
       요구된 순서 그대로: 접촉 → 플래시 → 스파크 → 타격음 → 짧은 히트스탑 → 넉백.
       (넉백 자체의 값/지속시간은 PHASE 6 그대로 — 여기서 건드리지 않는다) */
    applyHit: function (e, player) {
      e.lastHitAttackId = player.attackId;
      e.hp -= 1;

      var dx = e.x - player.x, dy = e.y - player.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      var nx = dx / dist, ny = dy / dist;

      e.hitFlashT = FLASH_DURATION;               // A. 플래시 (짧고 또렷하게, 넉백과 무관)
      this.spawnParticles(e.x, e.y, 4, nx, ny, 'spark'); // B. 임팩트 스파크

      if (e.hp <= 0) {
        e.state = 'DEAD';
        e.deathT = DEATH_DURATION;
        e.knockVX = 0; e.knockVY = 0;
        this.spawnParticles(e.x, e.y, 6, nx, ny, 'moss');
        if (MG.Audio && MG.Audio.playEnemyDefeat) MG.Audio.playEnemyDefeat();
      } else {
        e.state = 'HIT';
        e.stateT = KNOCKBACK_DURATION;             // E. 넉백 (기존 값 그대로)
        e.knockVX = nx * (KNOCKBACK_DIST / KNOCKBACK_DURATION);
        e.knockVY = ny * (KNOCKBACK_DIST / KNOCKBACK_DURATION);
        if (MG.Audio && MG.Audio.playEnemyHit) MG.Audio.playEnemyHit(); // D. 타격음
      }

      if (MG.Game && MG.Game.hitStop) MG.Game.hitStop(HITSTOP_DURATION); // C. 히트스탑
    },

    /* PHASE 6.2: 돌진이 플레이어 몸에 실제로 닿았는지 — 이동 충돌(footRect)이 아니라
       전투용 허트박스끼리 겹치는지로 판정한다(검 판정과 같은 방식, 새 물리 없음).
       체력/데미지는 없다 — MG.Player.onContactHit() 이 순수 연출만 재생한다. */
    checkPlayerContact: function (e, player) {
      if (!MG.Player || !MG.Player.getHurtbox) return;

      var hurt = this.getHurtbox(e);
      var pHurt = MG.Player.getHurtbox();
      if (!MG.Collision.overlaps(hurt.x, hurt.y, hurt.w, hurt.h, pHurt.x, pHurt.y, pHurt.w, pHurt.h)) return;

      e.lungeContactDone = true;
      MG.Player.onContactHit(e.x, e.y);

      var dx = player.x - e.x, dy = player.y - e.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      this.spawnParticles(player.x, player.y, 3, dx / dist, dy / dist, 'contact');
    },

    /* ------------------------------------------------------------ 파티클 */
    /* type: 'spark'(모슬링 피격 — 밝은 불빛) | 'moss'(처치 — 기존 이끼색 포프) |
             'contact'(PHASE 6.2: 돌진이 플레이어에 닿음 — 옅은 붉은빛) */
    spawnParticles: function (x, y, count, nx, ny, type) {
      var spdBase = 22, spdRand = 26, lifeBase = 0.22, lifeRand = 0.12, maxLife = 0.34;
      if (type === 'spark') { spdBase = 30; spdRand = 30; lifeBase = 0.14; lifeRand = 0.08; maxLife = 0.22; }
      else if (type === 'contact') { spdBase = 20; spdRand = 18; lifeBase = 0.12; lifeRand = 0.06; maxLife = 0.18; }

      for (var i = 0; i < count; i++) {
        var ang = Math.atan2(ny, nx) + (Math.random() - 0.5) * 2.4;
        var spd = spdBase + Math.random() * spdRand;
        this.particles.push({
          x: x, y: y - 8,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: lifeBase + Math.random() * lifeRand,
          maxLife: maxLife,
          type: type || 'moss'
        });
      }
    },

    updateParticles: function (dt) {
      for (var i = this.particles.length - 1; i >= 0; i--) {
        var p = this.particles[i];
        p.life -= dt;
        if (p.life <= 0) { this.particles.splice(i, 1); continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.9;
        p.vy *= 0.9;
      }
    },

    /* --------------------------------------------------------- 렌더링 */

    /* game.js 가 y 정렬용으로 수집한다 (map.js 의 collectProps 와 같은 패턴) */
    collect: function (out, cam) {
      for (var i = 0; i < this.list.length; i++) {
        var e = this.list[i];
        if (e.x < cam.x - 40 || e.x > cam.x + cam.w + 40) continue;
        if (e.y < cam.y - 40 || e.y > cam.y + cam.h + 40) continue;
        out.push({ y: e.y, kind: 'enemy', obj: e });
      }
      return out;
    },

    renderOne: function (ctx, e) {
      if (e.state === 'DEAD') {
        var fade = Math.max(0, e.deathT / DEATH_DURATION);
        ctx.save();
        ctx.globalAlpha = fade;
        this.drawBody(ctx, e, e.scale * (0.4 + 0.6 * fade));
        ctx.restore();
      } else {
        this.drawBody(ctx, e, e.scale);
      }

      if (DEBUG_ENEMY) this.drawDebug(ctx, e);
    },

    drawBody: function (ctx, e, scale) {
      var x = e.x, y = e.y;
      var leanX = 0;
      var windupProgress = 0; // 0~1, 링/눈 펄스에서 재사용

      // PHASE 6.1/6.2: 윈드업/돌진을 몸짓으로 강하게 텔레그래프한다.
      // "윈드업이 잘 안 보인다" 피드백을 받아 6.1 대비 훨씬 크게 웅크리고,
      // 플레이어 쪽으로 살짝 기울며(facingSign 방향), 아래에서 호박색 경고
      // 링까지 더해 세 가지 신호(크기+기울기+색)가 동시에 나가도록 했다.
      if (e.state === 'CHASE' && e.chasePhase === 'windup') {
        windupProgress = 1 - Math.max(0, Math.min(1, e.chaseSubT / WINDUP_DURATION));
        scale *= 1 - 0.30 * windupProgress;               // 6.1: 0.16 → 6.2: 0.30 (훨씬 크게 웅크림)
        leanX = e.facingSign * 2.4 * windupProgress;        // 플레이어(진행) 방향으로 기울기
      } else if (e.state === 'CHASE' && e.chasePhase === 'lunge') {
        scale *= 1.22;
      }

      var bob = (e.state === 'CHASE' || e.state === 'WANDER')
        ? Math.abs(Math.sin(e.animT * 7)) * 1.2
        : Math.sin(e.animT * 1.8) * 0.5;
      var topY = y - bob;
      var bx = x + leanX;   // 윈드업 중 몸통 상단이 진행 방향으로 기우는 위치 (발은 x 에 고정)

      // PHASE 6.2: 돌진 스트레치 트레일 — 튀어나온 방향의 반대편에 옅은 잔상을
      // 한 장 남겨 "쭉 뻗어나간다"는 모션을 보탠다 (칼 트레일과 같은 발상).
      if (e.state === 'CHASE' && e.chasePhase === 'lunge') {
        var trailBack = 3.2;
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.fillStyle = C.bodyDark;
        ctx.beginPath();
        ctx.arc(x - e.lungeDX * trailBack, topY - e.lungeDY * trailBack, 4.4 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 그림자
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.beginPath();
      ctx.ellipse(Math.round(x), Math.round(y + 1), 6 * scale, 2.2 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      // PHASE 6.2: 윈드업 경고 링 — 호박색(위협 신호 색)으로 눈 깜빡임과 같은
      // 박자로 펄스한다. 크기/기울기와 별개의 세 번째 신호라서 놓치기 어렵다.
      if (windupProgress > 0) {
        var ringPulse = 0.5 + 0.5 * Math.sin(e.animT * 20);
        ctx.save();
        ctx.globalAlpha = (0.25 + 0.35 * ringPulse) * Math.min(1, windupProgress * 2.2);
        ctx.strokeStyle = '#ffb347';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(bx, topY - 5 * scale, (6.5 + ringPulse * 1.2) * scale, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 몸통 — 원 세 개를 겹쳐 뭉툭한 이끼 덩어리 실루엣을 만든다 (나무보다 훨씬 작다)
      var lobes = [
        [bx - 3.5 * scale, topY - 3 * scale, 4.2 * scale],
        [bx + 3.5 * scale, topY - 2.6 * scale, 3.8 * scale],
        [bx,                topY - 6 * scale, 4.6 * scale]
      ];
      ctx.fillStyle = C.bodyDark;
      for (var i = 0; i < lobes.length; i++) {
        ctx.beginPath();
        ctx.arc(lobes[i][0], lobes[i][1], lobes[i][2], 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = C.bodyMid;
      ctx.beginPath();
      ctx.arc(bx - 1 * scale, topY - 7 * scale, 3.6 * scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = C.bodyLight;
      ctx.beginPath();
      ctx.arc(bx - 2.4 * scale, topY - 8.4 * scale, 1.9 * scale, 0, Math.PI * 2);
      ctx.fill();

      // 이끼 잎/잔가지 텍스처
      ctx.fillStyle = C.tuft;
      ctx.fillRect(Math.round(bx - 4.6 * scale), Math.round(topY - 9.5 * scale), 2, 2);
      ctx.fillRect(Math.round(bx + 3.4 * scale), Math.round(topY - 8.5 * scale), 2, 2);

      // 눈 — 살짝 이동 방향 쪽으로 치우치고, 추격 중엔 더 밝게 빛난다.
      // 윈드업 중엔 더 빠르고 급하게 깜빡여 "곧 돌진한다"는 경고로 읽히게 한다.
      var glow;
      if (e.state === 'CHASE' && e.chasePhase === 'windup') {
        glow = 0.55 + 0.45 * Math.sin(e.animT * 20);
      } else if (e.state === 'CHASE') {
        glow = 0.75 + 0.25 * Math.sin(e.animT * 9);
      } else {
        glow = 0.45 + 0.2 * Math.sin(e.animT * 2.2);
      }
      var eyeDX = e.facingSign * 1.1 * scale;
      ctx.fillStyle = 'rgba(234, 255, 176, ' + glow.toFixed(2) + ')';
      ctx.fillRect(Math.round(bx - 1.6 * scale + eyeDX), Math.round(topY - 6.2 * scale), 1, 1);
      ctx.fillRect(Math.round(bx + 1.2 * scale + eyeDX), Math.round(topY - 6.2 * scale), 1, 1);
      ctx.fillStyle = C.eyeCore;
      ctx.fillRect(Math.round(bx - 1.6 * scale + eyeDX), Math.round(topY - 6.0 * scale), 1, 1);
      ctx.fillRect(Math.round(bx + 1.2 * scale + eyeDX), Math.round(topY - 6.0 * scale), 1, 1);

          ctx.beginPath();

          ctx.fillStyle = 'rgba(255, 244, 196, ' + a.toFixed(2) + ')';
          ctx.fillRect(Math.round(p.x), Math.round(p.y), 1, 1);
          ctx.fillStyle = 'rgba(255, 255, 255, ' + (a * 0.6).toFixed(2) + ')';
          ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y), 1, 1);

     - 세로 모드를 막던 전체화면 경고/일시정지 로직을 완전히 제거했다.
       세로가 이제 기본 플레이 방향이므로 더 이상 "차단해야 할 상태"가 아니다.
     - updateOrientationAndLayout() 이 방향 판별 + 레이아웃 재계산을
       한 곳에서 담당한다. 게임을 멈추거나 화면을 가리는 부수효과는 없다.
   ========================================================================== */
(function (global) {
  'use strict';

  var MG = global.MG = global.MG || {};

  var UI = {
    el: {},
    isPortrait: false,

    init: function () {
      this.el.title = document.getElementById('overlay-title');
      this.el.startBtn = document.getElementById('btn-start');
      this.el.version = document.getElementById('hud-version');

      if (this.el.version && MG.Game) {
        this.el.version.textContent = 'v' + MG.Game.VERSION;
      }

      var self = this;

      if (this.el.startBtn) {
        // click 하나만 사용 (터치에서도 안정적으로 동작하며 중복 발화가 없다)
        this.el.startBtn.addEventListener('click', function (e) {
          e.preventDefault();
          if (MG.Audio && MG.Audio.unlock) MG.Audio.unlock();
          if (MG.Game) MG.Game.startAdventure();
        });
      }

      // 방향/레이아웃 변화 감지: matchMedia + resize 양쪽을 모두 사용해 기기별 차이를 흡수

      }
      if (global.matchMedia) {
        var mq = global.matchMedia('(orientation: portrait)');

       여기서 MG.Game.paused 를 건드리거나 #game-root 를 숨기지 않는다.
       resize/orientationchange/visualViewport 어디서 불러도 안전하다. */
    updateOrientationAndLayout: function () {
      var portrait = global.innerHeight >= global.innerWidth;
      this.isPortrait = portrait;
      document.body.classList.toggle('mg-portrait', portrait);
      document.body.classList.toggle('mg-landscape', !portrait);

      if (MG.Game && MG.Game.resize) MG.Game.resize();

    showTitle: function () {

    },

    hideTitle: function () {
      if (this.el.title) this.el.title.hidden = true;
    },

    /* game.js 의 resize() 에서 호출 — 화면 픽셀 크기 전달.
       ResizeObserver 경유이므로 resize 이벤트가 오지 않는 환경에서도 방향 클래스가
       동기화된다. (주의: 여기서 다시 Game.resize() 를 호출하면 무한 루프가 되므로
       방향 클래스 갱신만 하고 레이아웃 재계산은 하지 않는다) */
    onResize: function (/* w, h */) {
      var portrait = global.innerHeight >= global.innerWidth;
      this.isPortrait = portrait;
      document.body.classList.toggle('mg-portrait', portrait);

/* ==========================================================================

   v0.1.1 PORTRAIT CONVERSION:
     - 내부 해상도를 세로형 360x640 (9:16) 로 전환 (기존 480x270 16:9 폐기)
     - resize() 의 비율-맞춤 로직 자체는 해상도에 무관하게 동작하므로
       INTERNAL_W/H 상수만 바꾸면 카메라·렌더 파이프라인이 함께 따라온다
     - 상태 머신(BOOT / TITLE / PLAY)의 뼈대

   ========================================================================== */
(function (global) {
  'use strict';

  var MG = global.MG = global.MG || {};

  // v0.1.1: 모바일 세로 플레이가 기본 화면이다 (9:16).
  // 데스크톱에서는 이 세로 무대가 화면 중앙에 최대 크기로 축소 표시된다 (style.css 참고).
  var INTERNAL_W = 360;
  var INTERNAL_H = 640;
  var MAX_DT = 0.05;      // 탭 전환 후 큰 점프 방지 (초)

  // 개발용 디버그 오버레이. true 로 바꾸면 화면 크기/카메라/입력 상태를 표시한다.
  var DEBUG_MOBILE_LAYOUT = false;

  // "탁 걸리는" 손맛을 준다. 완전히 멈추면(dt=0) 애니메이션/타이머가 이상하게

  // 쿨다운 등 기존 타이밍 코드를 손대지 않고도 "거의 정지"처럼 보인다.
  var HITSTOP_SCALE = 0.06;

  var Game = {
    VERSION: '0.1.5',
    WIDTH: INTERNAL_W,
    HEIGHT: INTERNAL_H,
    DEBUG_MOBILE_LAYOUT: DEBUG_MOBILE_LAYOUT,

    canvas: null,
    ctx: null,
    stage: null,

    state: 'BOOT',        // BOOT | TITLE | PLAY
    running: false,
    paused: false,        // 세로 방향 경고 등으로 인한 일시정지
    time: 0,              // 누적 경과 시간(초)
    frame: 0,
    hitStopT: 0,           // PHASE 6.1: 남은 히트스탑 시간(실시간 초)
    _lastTs: 0,
    _rafId: 0,

    /* ---------------------------------------------------------------- init */
    init: function () {
      this.canvas = document.getElementById('game-canvas');
      if (!this.canvas) {
        console.error('[MG] game-canvas 를 찾을 수 없습니다.');
        return false;
      }
      this.stage = document.getElementById('stage');
      this.root = document.getElementById('game-root');
      this.ctx = this.canvas.getContext('2d', { alpha: false });

      this.canvas.width = INTERNAL_W;
      this.canvas.height = INTERNAL_H;
      this.ctx.imageSmoothingEnabled = false;

      this._onResize = function () { self.resize(); };
      global.addEventListener('resize', this._onResize);
      global.addEventListener('orientationchange', this._onResize);

      // 컨테이너 크기가 늦게 확정되는 환경(임베드 뷰 등)까지 확실히 따라간다

        this._ro.observe(this.root);

      // 안전망: 일부 모바일 브라우저는 주소창 접힘/회전 시 resize 이벤트를 누락한다.

        var v = self.viewportSize();
        if (v.w > 0 && v.h > 0 && (v.w !== self._lastVW || v.h !== self._lastVH)) self.resize();
      }, 500);

      this.resize();
      this.state = 'TITLE';
      this.start();

    },

    /* 현재 사용 가능한 화면 크기.
       모바일 브라우저의 주소창/키보드 변화는 visualViewport 가 더 정확하다. */
    viewportSize: function () {

      var h = (this.root && this.root.clientHeight) || global.innerHeight || 0;
      var vvp = global.visualViewport;
      if (vvp && vvp.width > 0 && vvp.height > 0) {

    /* -------------------------------------------------------------- resize

       세로로 긴 화면(휴대폰)에서는 거의 꽉 차고, 가로로 넓은 화면(데스크톱)에서는
       세로 무대가 가운데 놓이고 좌우에 여백(배경색)이 남는다. 비율 계산 자체는
       INTERNAL_W/H 값에 무관하므로 해상도를 바꿔도 이 로직은 그대로 쓸 수 있다. */
    resize: function () {
      if (!this.stage) return;

      var v = this.viewportSize();
      var vw = v.w, vh = v.h;

      // 레이아웃이 아직 확정되지 않았으면(크기 0) 다음 프레임에 다시 시도
      if (vw <= 0 || vh <= 0) {

        global.requestAnimationFrame(function () { self0.resize(); });
        return;
      }

      var w = vw;
      var h = Math.round(w / ratio);
      if (h > vh) {
        h = vh;
        w = Math.round(h * ratio);
      }

      this.stage.style.width = w + 'px';
      this.stage.style.height = h + 'px';
      this._lastVW = vw;
      this._lastVH = vh;

      this.scale = w / INTERNAL_W;   // 화면 픽셀 : 내부 픽셀 비율 (터치 좌표 변환용)

      if (MG.UI && MG.UI.onResize) MG.UI.onResize(w, h);
    },

    /* --------------------------------------------------------------- 루프 */
    start: function () {

      this.running = true;
      this._lastTs = 0;

      this._step = function (ts) {

        if (!self._lastTs) self._lastTs = ts;
        var dt = (ts - self._lastTs) / 1000;

        if (!self.paused) {
          self.time += dt;
          self.frame++;

          // 히트스탑: 남은 시간은 "실시간"으로 줄어들지만(다음 프레임엔 반드시

       (권장 0.03~0.06초). 같은 프레임에 여러 히트가 겹쳐도 시간이 계속 늘어나지
       않도록(작업 중첩 방지) 더 긴 쪽으로만 갱신한다. */
    hitStop: function (duration) {

    },

    /* 타이틀 화면에서 "모험 시작"을 눌렀을 때 */
    startAdventure: function () {
      this.state = 'PLAY';
      if (MG.UI && MG.UI.hideTitle) MG.UI.hideTitle();
    },

    /* 카메라 — 맵이 화면보다 크므로 플레이어를 따라가되 맵 밖은 보여주지 않는다 */
    camera: { x: 0, y: 0, w: INTERNAL_W, h: INTERNAL_H },

    updateCamera: function () {
      var cam = this.camera;
      cam.w = INTERNAL_W;
      cam.h = INTERNAL_H;

      if (!MG.Player || !MG.Map) return;

      cam.x = Math.round(MG.Player.x - INTERNAL_W / 2);
      cam.y = Math.round(MG.Player.y - INTERNAL_H / 2);

      var maxX = MG.Map.WIDTH - INTERNAL_W;
      var maxY = MG.Map.HEIGHT - INTERNAL_H;
      if (cam.x < 0) cam.x = 0;
      if (cam.y < 0) cam.y = 0;
      if (cam.x > maxX) cam.x = maxX;
      if (cam.y > maxY) cam.y = maxY;
    },

    /* -------------------------------------------------------------- update */
    update: function (dt) {
      // PHASE 7 이후: 동료 갱신이 여기에 들어간다. 공격 상태 자체는
      // player.js 의 update() 안에서 combat.js 를 통해 함께 진행된다.
      if (MG.Input && MG.Input.update) MG.Input.update(dt);
      if (MG.Player && MG.Player.update) MG.Player.update(dt);
      if (MG.Enemy && MG.Enemy.update) MG.Enemy.update(dt);
      this.updateCamera();
      if (DEBUG_MOBILE_LAYOUT) this.updateDebugPanel();
    },

    /* v0.1.1: DEBUG_MOBILE_LAYOUT 이 true 일 때만 동작하는 개발용 정보 패널.
       화면 크기 / 캔버스 논리 해상도 / 방향 / 카메라 크기 / 입력값을 보여준다. */
    updateDebugPanel: function () {
      var el = document.getElementById('debug-panel');
      if (!el) return;
      el.hidden = false;
      var v = this.viewportSize();
      var axis = (MG.Input && MG.Input.axis) || { x: 0, y: 0 };
      var joyActive = !!(MG.Input && MG.Input._joyPointerId !== null && MG.Input._joyPointerId !== undefined);
      el.textContent =
        'viewport: ' + Math.round(v.w) + ' x ' + Math.round(v.h) + '\n' +
        'canvas(logical): ' + INTERNAL_W + ' x ' + INTERNAL_H + '\n' +
        'orientation: ' + (v.w >= v.h ? 'landscape' : 'portrait') + '\n' +
        'camera: ' + this.camera.w + ' x ' + this.camera.h +
          ' @ (' + this.camera.x + ', ' + this.camera.y + ')\n' +
        'input: x=' + axis.x.toFixed(2) + ' y=' + axis.y.toFixed(2) + '\n' +
        'joystick active: ' + joyActive;
    },

    /* -------------------------------------------------------------- render */
    render: function () {
      var ctx = this.ctx;
      if (!ctx) return;

      if (!MG.Map || !MG.Map.ground) {
        // 맵이 준비되지 않았을 때의 안전한 대체 화면
        this.drawPlaceholderScene(ctx);
        if (MG.Player && MG.Player.render) MG.Player.render(ctx);
        this.drawVignette(ctx);
        return;
      }

      var cam = this.camera;
      var t = this.time;

      ctx.save();
      ctx.translate(-cam.x, -cam.y);

      MG.Map.renderGround(ctx);
      MG.Map.renderWater(ctx, cam, t);

      // 나무/바위/모슬링/플레이어를 발 높이(y) 순으로 그려 앞뒤 관계를 만든다
      var props = MG.Map.collectProps([], cam);
      if (MG.Enemy && MG.Enemy.collect) MG.Enemy.collect(props, cam);
      if (MG.Player) {
        props.push({ y: MG.Player.y, kind: 'player' });
      }
      props.sort(function (a, b) { return a.y - b.y; });

      for (var i = 0; i < props.length; i++) {
        if (props[i].kind === 'player') {
          if (MG.Player.render) MG.Player.render(ctx);
        } else if (props[i].kind === 'enemy') {
          MG.Enemy.renderOne(ctx, props[i].obj);
        } else {
          MG.Map.renderProp(ctx, props[i]);
        }
      }

      if (MG.Enemy && MG.Enemy.renderParticles) MG.Enemy.renderParticles(ctx);

      MG.Map.renderFireflies(ctx, cam, t);

      // DEBUG_COMBAT 이 true 일 때만 그려진다 (combat.js 내부에서 조기 반환) —
      // 카메라 변환이 아직 적용된 상태여야 히트박스가 월드 좌표와 정확히 겹친다.
      if (MG.Combat && MG.Combat.renderDebug) MG.Combat.renderDebug(ctx, MG.Player);

      ctx.restore();

      this.drawVignette(ctx);
    },

    /* PHASE 4에서 실제 숲 맵(map.js)으로 교체될 임시 분위기 배경.
       캔버스 렌더링/스케일 검증용이며 게임 로직은 포함하지 않는다. */
    drawPlaceholderScene: function (ctx) {
      var W = INTERNAL_W, H = INTERNAL_H, t = this.time;

      // 밤 숲 바닥 그라데이션
      var sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0.0, '#132a24');
      sky.addColorStop(0.45, '#1b3a2a');
      sky.addColorStop(1.0, '#25492f');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // 달빛 웅덩이
      var moon = ctx.createRadialGradient(W * 0.5, H * 0.36, 6, W * 0.5, H * 0.36, H * 0.75);
      moon.addColorStop(0, 'rgba(190, 220, 255, 0.20)');
      moon.addColorStop(1, 'rgba(190, 220, 255, 0)');
      ctx.fillStyle = moon;
      ctx.fillRect(0, 0, W, H);

      // 바닥 풀 결(가로 스트로크) — 정적인 패턴
      ctx.fillStyle = 'rgba(20, 60, 38, 0.35)';
      for (var y = 0; y < H; y += 6) {
        var off = ((y * 37) % 11) - 5;
        ctx.fillRect(off, y, W, 1);
      }

      // 떠다니는 숲의 빛(반딧불) — 애니메이션 동작 확인용
      for (var i = 0; i < 14; i++) {
        var seed = i * 12.9898;
        var fx = (Math.sin(seed) * 0.5 + 0.5) * W;
        var fy = (Math.cos(seed * 1.7) * 0.5 + 0.5) * H;
        var drift = Math.sin(t * 0.6 + i) * 9;
        var bob = Math.cos(t * 0.9 + i * 1.3) * 6;
        var glow = 0.35 + 0.35 * Math.sin(t * 2.2 + i);
        ctx.fillStyle = 'rgba(206, 244, 168, ' + glow.toFixed(3) + ')';
        ctx.fillRect(Math.round(fx + drift), Math.round(fy + bob), 2, 2);
      }
    },

    /* 화면 가장자리 비네트 — 배경/플레이어 위에 항상 마지막으로 덮는다 */
    drawVignette: function (ctx) {
      var W = INTERNAL_W, H = INTERNAL_H;
      var vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.55)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
    }
  };

  MG.Game = Game;
})(window);

/* ---- js/main.js ---- */
/* ==========================================================================
   main.js — 애플리케이션 진입점
   각 시스템을 정해진 순서로 초기화한다.
   ========================================================================== */
(function (global) {
  'use strict';

  var MG = global.MG = global.MG || {};

  function boot() {
    try {
      if (MG.Audio && MG.Audio.init) MG.Audio.init();
      if (MG.Input && MG.Input.init) MG.Input.init();

      if (!MG.Game.init()) return;      // 캔버스 / 루프 / 스케일
      if (MG.Map && MG.Map.init) MG.Map.init();       // 지형 / 충돌 (Player 보다 먼저)
      if (MG.Player && MG.Player.init) MG.Player.init();
      if (MG.Enemy && MG.Enemy.init) MG.Enemy.init();  // 모슬링 배치 (맵 충돌 데이터 필요 — Map 이후)
      MG.UI.init();                     // 오버레이 / 방향 경고 (Game 이후에 초기화)

      console.log('[달빛 숲의 수호자] Prototype v' + MG.Game.VERSION + ' — PHASE 6.2');
    } catch (err) {
      console.error('[MG] 초기화 실패:', err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);

</script>
</body>
</html>
